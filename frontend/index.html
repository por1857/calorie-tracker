<!doctype html>
<html lang="de-AT">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: App nutzt den ganzen iPhone-Bildschirm (Notch-Ränder regelt base.css) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kalorien</title>
  <meta name="description" content="Kalorien und Makros einfach tracken.">

  <!-- Sicherheit: Die Seite darf nur Dateien von sich selbst laden – keine
       fremden Skripte, keine fremden Server. Schützt gegen eingeschleusten Code. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">

  <!-- PWA: macht die Seite auf dem iPhone installierbar -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Kalorien">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#EEF1F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1417" media="(prefers-color-scheme: dark)">

  <!-- Reihenfolge wichtig: erst Tokens, dann Basis, dann Bausteine -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- type="module" erlaubt import/export zwischen den JS-Dateien -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="app">

    <!-- Kopfzeile: Tag wechseln -->
    <header class="daybar">
      <button class="icon-button" type="button" id="prev-day" aria-label="Vorheriger Tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 class="daybar__title">
        <span id="day-title">Heute</span>
        <span class="daybar__sub" id="day-subtitle"></span>
      </h1>
      <button class="icon-button" type="button" id="next-day" aria-label="Nächster Tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </header>

    <!-- Anzeigefeld: wie viele Kalorien noch übrig sind -->
    <section class="readout" id="readout" aria-labelledby="readout-label">
      <p class="readout__label" id="readout-label">Noch übrig</p>
      <p class="readout__value num">
        <span id="kcal-remaining">2 000</span>
        <span class="readout__unit">kcal</span>
      </p>
      <div class="meter meter--on-readout" id="kcal-meter" role="progressbar"
           aria-label="Kalorien gegessen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="meter__bar"></div>
      </div>
      <p class="readout__footer num">
        <span><span id="kcal-eaten">0</span> gegessen</span>
        <span>Ziel <span id="kcal-goal">2 000</span></span>
      </p>
    </section>

    <!-- Makros. Die Werte füllt js/app.js -->
    <ul class="macros" aria-label="Makronährstoffe">
      <li class="macro macro--protein">
        <span class="macro__name">Protein</span>
        <p class="macro__value num">
          <span data-macro-eaten="protein">0</span>
          <span class="macro__goal">/ <span data-macro-goal="protein">0</span> g</span>
        </p>
        <div class="meter meter--protein" data-macro-meter="protein"><div class="meter__bar"></div></div>
      </li>
      <li class="macro macro--carbs">
        <span class="macro__name">Kohlenhydrate</span>
        <p class="macro__value num">
          <span data-macro-eaten="carbs">0</span>
          <span class="macro__goal">/ <span data-macro-goal="carbs">0</span> g</span>
        </p>
        <div class="meter meter--carbs" data-macro-meter="carbs"><div class="meter__bar"></div></div>
      </li>
      <li class="macro macro--fat">
        <span class="macro__name">Fett</span>
        <p class="macro__value num">
          <span data-macro-eaten="fat">0</span>
          <span class="macro__goal">/ <span data-macro-goal="fat">0</span> g</span>
        </p>
        <div class="meter meter--fat" data-macro-meter="fat"><div class="meter__bar"></div></div>
      </li>
    </ul>

    <!-- Mahlzeiten. Inhalt erzeugt js/app.js aus der Vorlage unten -->
    <div id="meals"></div>
  </main>

  <!-- Vorlage für eine Mahlzeit. <template> wird nicht angezeigt,
       sondern von JavaScript kopiert und befüllt. -->
  <template id="meal-template">
    <section class="meal">
      <header class="meal__header">
        <h2 class="meal__title"></h2>
        <span class="meal__total num"></span>
      </header>
      <ul class="meal__list"></ul>
      <p class="meal__empty">Noch nichts eingetragen.</p>
    </section>
  </template>

  <!-- Plus-Knopf: Eintrag hinzufügen -->
  <button class="fab" type="button" id="add-entry" aria-label="Eintrag hinzufügen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Tab-Leiste -->
  <nav class="tabbar" aria-label="Hauptnavigation">
    <button class="tabbar__item" type="button" aria-current="page" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg>
      Heute
    </button>
    <button class="tabbar__item" type="button" data-tab="foods">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".9" fill="currentColor"/><circle cx="4" cy="12" r=".9" fill="currentColor"/><circle cx="4" cy="18" r=".9" fill="currentColor"/></svg>
      Lebensmittel
    </button>
    <button class="tabbar__item" type="button" data-tab="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      Ziele
    </button>
  </nav>

  <!-- Kurze Rückmeldungen. aria-live: VoiceOver liest neue Texte vor -->
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</body>
</html>
